services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: ado-new-direct-combuilder:latest
    container_name: bank-comm-agent
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Paths inside the mounted volume. Kept here as well as in the image so
      # `docker compose run` one-offs get the same layout.
      REPO_CACHE_DIR: /data/repos
      WORKTREE_ROOT: /data/worktrees
      STATE_DIR: /data/state
      LOG_DIR: /data/logs
      SKILLS_SOURCE_DIR: /app/.claude
      CONTINIA_CLI_PATH: /usr/local/bin/continia
      CONTINIA_ALC_CACHE: /data/alc-cache
      CONTINIA_AUTO_INSTALL_ALC: "1"
    volumes:
      # Repo mirrors, worktrees, job state, logs and the AL compiler cache all
      # survive restarts and image rebuilds.
      - agent-data:/data
    # Cloning Continia Banking and compiling AL are both memory-hungry.
    deploy:
      resources:
        limits:
          memory: 8G
    healthcheck:
      test: ["CMD", "bun", "run", "src/cli/index.ts", "status"]
      interval: 5m
      timeout: 60s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  agent-data:
